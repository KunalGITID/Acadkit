name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Bundle size
        run: npm run size

  e2e:
    # Playwright against `npm run dev:mock`: sign in, mark attendance, add
    # marks, and replay a write made offline. No real Supabase involved.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rls:
    # pgTAP tests in supabase/tests: a throwaway local Supabase is built
    # from supabase/migrations, then every table is checked for one account
    # reaching another's data. `--local` only - never the hosted project.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Auth and Storage stay: their own migrations define auth.uid() and
      # the storage.objects policies under test. Everything else is skipped.
      - name: Start local Supabase
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: RLS tests
        run: supabase test db --local

  lighthouse:
    # Lighthouse on the production build, median of three runs, against the
    # limits in lighthouserc.json. It loads the sign-in screen, so this is the
    # first visit's download and render speed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app refuses to start without these. Nothing is contacted: the
      # sign-in screen renders without a network call.
      - name: Build
        run: npx vite build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: lighthouse

      - name: Lighthouse
        run: npx -y @lhci/cli@0.15.1 autorun

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
