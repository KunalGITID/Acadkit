name: Feature request
description: Something AcadKit should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
      placeholder: Before a CT I can't see which units I haven't revised yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Rough is fine.
  - type: textarea
    id: instead
    attributes:
      label: What you do instead today
