    <title>AcadKit</title>
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme/mode.
      // The hex map here mirrors each theme's --bg in src/index.css — keep in sync.
      (function () {
        try {
          var BG_HEX = {
            "sakura-light": "#f9f4f0",
            "sakura-dark": "#170c11",
            "terminal-light": "#f5f5ef",
            "terminal-dark": "#070e0b",
            "aurora-light": "#f8f8fc",
            "aurora-dark": "#0b0817",
            "oled-light": "#ffffff",
            "oled-dark": "#000000",
          };
          var name = localStorage.getItem("acadkit:theme-name") || "sakura";
          var mode =
            localStorage.getItem("acadkit:theme-mode") ||
            localStorage.getItem("acadkit:theme") || // legacy key
            "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = name;
          if (dark) document.documentElement.classList.add("dark");
          var meta = document.getElementById("theme-color-meta");
          if (meta) meta.setAttribute("content", BG_HEX[name + "-" + (dark ? "dark" : "light")]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Suppress iOS double-tap zoom for an app-like feel
      var lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        function (e) {
          var now = Date.now();
          if (now - lastTouchEnd < 300) e.preventDefault();
          lastTouchEnd = now;
        },
        { passive: false }
      );
    </script>
